# Add this file only when AI review is enabled and 9router runs in Docker on the
# same machine. Set AI_BASE_URL=http://9router:20128/v1 in .env.
#   docker compose -f compose.yml -f compose.ai.yml up -d
services:
  app:
    networks: [default, router]

networks:
  router:
    external: true
    name: 9router_default
