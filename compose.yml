# Self-hosted deployment. Public access goes through a reverse proxy or tunnel.
# The image is built by GitHub Actions; the server only pulls it. To build
# locally instead, add compose.build.yml.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/andisuartika/cv-generator:latest}
    container_name: cv-generator
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8102}:3000" # local only
    env_file:
      - path: .env # optional AI settings; see .env.example
        required: false
    # Limits keep this app from starving other services on a shared server.
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    shm_size: 256mb
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
